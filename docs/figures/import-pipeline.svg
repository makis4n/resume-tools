<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-label="The import pipeline. In the browser: parse, probe, validate, then either a template package or locked chunks. On the server: a package cache keyed by macro hash, and on a cache miss a call to the language model for names and structure. The only data crossing to the server is macro definitions and placeholdered call sites."><style>text{font-family:Inconsolata,Menlo,Consolas,monospace}.box{fill:#F3F4F1;stroke:#1B1E25;stroke-width:1.2}.region{fill:none;stroke:#B4B9C4;stroke-dasharray:4 4;stroke-width:1}.regionlbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;fill:#5D6472}.t1{font-size:13px;font-weight:600;fill:#1B1E25}.t2{font-size:11px;fill:#5D6472}.lbl{font-size:11px;fill:#5D6472}.lblA{fill:#0E7C7B}.arr{stroke:#1B1E25;stroke-width:1.3;fill:none}.arrA{stroke:#0E7C7B;stroke-width:1.7;fill:none}.arrhead{fill:#1B1E25}.arrheadA{fill:#0E7C7B}</style><rect x="0" y="0" width="720" height="500" fill="#FCFCFB"/>
        <defs>
          <marker id="f2-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrhead"/></marker>
          <marker id="f2-arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrheadA"/></marker>
        </defs>

        <rect class="region" x="20" y="20" width="400" height="470" rx="2"/>
        <text class="regionlbl" x="32" y="42">In the browser</text>
        <rect class="region" x="460" y="20" width="240" height="470" rx="2"/>
        <text class="regionlbl" x="472" y="42">Server</text>

        <line class="arr" x1="140" y1="30" x2="140" y2="58" marker-end="url(#f2-arr)"/>
        <text class="lbl" x="150" y="50" text-anchor="start">the user's file</text>

        <rect class="box" x="40" y="60" width="200" height="54" rx="2"/>
        <text class="t1" x="140" y="83" text-anchor="middle">Parse</text>
        <text class="t2" x="140" y="100" text-anchor="middle">.tex or zip into a tree</text>

        <rect class="box" x="40" y="160" width="200" height="54" rx="2"/>
        <text class="t1" x="140" y="183" text-anchor="middle">Probe</text>
        <text class="t2" x="140" y="200" text-anchor="middle">wrap arguments, compile, bisect</text>

        <rect class="box" x="40" y="300" width="200" height="54" rx="2"/>
        <text class="t1" x="140" y="323" text-anchor="middle">Validate</text>
        <text class="t2" x="140" y="340" text-anchor="middle">identical output and mutations</text>

        <rect class="box" x="40" y="410" width="200" height="54" rx="2"/>
        <text class="t1" x="140" y="433" text-anchor="middle">Template package</text>
        <text class="t2" x="140" y="450" text-anchor="middle">plus mapping to the model</text>

        <rect class="box" x="270" y="410" width="130" height="54" rx="2"/>
        <text class="t1" x="335" y="433" text-anchor="middle">Locked chunks</text>
        <text class="t2" x="335" y="450" text-anchor="middle">shown, not editable</text>

        <rect class="box" x="480" y="160" width="200" height="54" rx="2"/>
        <text class="t1" x="580" y="183" text-anchor="middle">Package cache</text>
        <text class="t2" x="580" y="200" text-anchor="middle">keyed by macro hash</text>

        <rect class="box" x="480" y="290" width="200" height="54" rx="2"/>
        <text class="t1" x="580" y="313" text-anchor="middle">Name and structure</text>
        <text class="t2" x="580" y="330" text-anchor="middle">any model, structured output</text>

        <line class="arr" x1="140" y1="114" x2="140" y2="158" marker-end="url(#f2-arr)"/>
        <text class="lbl" x="150" y="140" text-anchor="start">tree</text>

        <line class="arrA" x1="240" y1="187" x2="478" y2="187" marker-end="url(#f2-arrA)"/>
        <text class="lbl lblA" x="359" y="166" text-anchor="middle">definitions and placeholdered</text>
        <text class="lbl lblA" x="359" y="179" text-anchor="middle">call sites, never the content</text>

        <line class="arr" x1="540" y1="214" x2="540" y2="288" marker-end="url(#f2-arr)"/>
        <text class="lbl" x="548" y="255" text-anchor="start">miss</text>
        <line class="arr" x1="620" y1="290" x2="620" y2="216" marker-end="url(#f2-arr)"/>
        <text class="lbl" x="628" y="255" text-anchor="start">schema</text>

        <path class="arr" d="M 480,204 H 440 V 327 H 242" marker-end="url(#f2-arr)"/>
        <text class="lbl" x="341" y="318" text-anchor="middle">schema, on hit or miss</text>

        <line class="arr" x1="140" y1="354" x2="140" y2="408" marker-end="url(#f2-arr)"/>
        <text class="lbl" x="150" y="385" text-anchor="start">passes</text>

        <path class="arr" d="M 240,347 H 335 V 408" marker-end="url(#f2-arr)"/>
        <text class="lbl" x="343" y="385" text-anchor="start">fails</text>
      </svg>
