<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="The edit loop. A click on the typeset page resolves a field through its markers and opens an overlay, which takes keystrokes instantly. The debounced edit updates the resume data, the compile worker regenerates the body and recompiles from the cached format, the DVI is converted to SVG with markers preserved, and the new page swaps in."><style>text{font-family:Inconsolata,Menlo,Consolas,monospace}.box{fill:#F3F4F1;stroke:#1B1E25;stroke-width:1.2}.region{fill:none;stroke:#B4B9C4;stroke-dasharray:4 4;stroke-width:1}.regionlbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;fill:#5D6472}.t1{font-size:13px;font-weight:600;fill:#1B1E25}.t2{font-size:11px;fill:#5D6472}.lbl{font-size:11px;fill:#5D6472}.lblA{fill:#0E7C7B}.arr{stroke:#1B1E25;stroke-width:1.3;fill:none}.arrA{stroke:#0E7C7B;stroke-width:1.7;fill:none}.arrhead{fill:#1B1E25}.arrheadA{fill:#0E7C7B}</style><rect x="0" y="0" width="760" height="320" fill="#FCFCFB"/>
        <defs>
          <marker id="f1-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrhead"/></marker>
          <marker id="f1-arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrheadA"/></marker>
        </defs>

        <rect class="box" x="20" y="60" width="170" height="56" rx="2"/>
        <text class="t1" x="105" y="83" text-anchor="middle">Typeset page</text>
        <text class="t2" x="105" y="101" text-anchor="middle">SVG, one element per glyph</text>

        <rect class="box" x="290" y="60" width="170" height="56" rx="2"/>
        <text class="t1" x="375" y="83" text-anchor="middle">Overlay editor</text>
        <text class="t2" x="375" y="101" text-anchor="middle">same font, in place</text>

        <rect class="box" x="560" y="60" width="170" height="56" rx="2"/>
        <text class="t1" x="645" y="83" text-anchor="middle">Resume data</text>
        <text class="t2" x="645" y="101" text-anchor="middle">canonical model</text>

        <rect class="box" x="560" y="230" width="170" height="56" rx="2"/>
        <text class="t1" x="645" y="253" text-anchor="middle">Compile worker</text>
        <text class="t2" x="645" y="271" text-anchor="middle">WASM engine, cached format</text>

        <rect class="box" x="290" y="230" width="170" height="56" rx="2"/>
        <text class="t1" x="375" y="253" text-anchor="middle">DVI to SVG</text>
        <text class="t2" x="375" y="271" text-anchor="middle">markers preserved</text>

        <line class="arrA" x1="190" y1="88" x2="288" y2="88" marker-end="url(#f1-arrA)"/>
        <text class="lbl lblA" x="240" y="130" text-anchor="middle">click resolves</text>
        <text class="lbl lblA" x="240" y="143" text-anchor="middle">the field via markers</text>

        <path class="arrA" d="M 320,60 C 320,26 430,26 430,58" marker-end="url(#f1-arrA)"/>
        <text class="lbl lblA" x="375" y="22" text-anchor="middle">keystrokes, under 16 ms</text>

        <line class="arr" x1="460" y1="88" x2="558" y2="88" marker-end="url(#f1-arr)"/>
        <text class="lbl" x="509" y="130" text-anchor="middle">edit, debounced</text>
        <text class="lbl" x="509" y="143" text-anchor="middle">about 150 ms</text>

        <line class="arr" x1="645" y1="116" x2="645" y2="228" marker-end="url(#f1-arr)"/>
        <text class="lbl" x="655" y="176" text-anchor="start">regenerate body</text>

        <line class="arr" x1="560" y1="258" x2="462" y2="258" marker-end="url(#f1-arr)"/>
        <text class="lbl" x="510" y="248" text-anchor="middle">DVI + markers</text>

        <path class="arr" d="M 290,258 H 105 V 118" marker-end="url(#f1-arr)"/>
        <text class="lbl" x="116" y="182" text-anchor="start">swap page,</text>
        <text class="lbl" x="116" y="195" text-anchor="start">about 300 ms</text>
      </svg>
