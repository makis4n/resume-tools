name: Bug
description: Something does not do what it should
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - editor
        - ats
        - shared
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happens instead
    validations:
      required: true
