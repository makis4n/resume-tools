# Workflows pin every action to a commit (decision 0029), and the ATS image pins its base images by
# digest; this keeps both current, in one grouped pull request a month each whose title passes the
# pr-title check.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(repo)"
  - package-ecosystem: docker
    directory: /apps/ats
    schedule:
      interval: monthly
    groups:
      ats-image:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ats)"
