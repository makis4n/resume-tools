name: ats

on:
  push:
    branches: [main]
    paths:
      - "apps/ats/**"
      - "packages/contracts/**"
      - ".github/workflows/ats.yml"
  pull_request:
    paths:
      - "apps/ats/**"
      - "packages/contracts/**"
      - ".github/workflows/ats.yml"

permissions:
  contents: read

# A newer push to a pull request cancels the older run; every push to main gets its own group, so
# each merge keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/ats
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
