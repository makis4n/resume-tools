name: ats

on:
  push:
    branches: [main]
    paths:
      - "apps/ats/**"
      - "packages/contracts/**"
      - ".github/workflows/ats.yml"
  pull_request:
    paths:
      - "apps/ats/**"
      - "packages/contracts/**"
      - ".github/workflows/ats.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ats
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
