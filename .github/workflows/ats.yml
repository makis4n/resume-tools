name: ats

on:
  push:
    branches: [main]
    paths:
      - "apps/ats/**"
      - "packages/contracts/**"
      - ".github/workflows/ats.yml"
  pull_request:
    paths:
      - "apps/ats/**"
      - "packages/contracts/**"
      - ".github/workflows/ats.yml"

permissions:
  contents: read

# A newer push to a pull request cancels the older run; every push to main gets its own group, so
# each merge keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/ats
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
