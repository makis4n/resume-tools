name: editor

on:
  push:
    branches: [main]
    paths:
      - "apps/editor/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "biome.json"
      - "tsconfig.base.json"
      - ".github/workflows/editor.yml"
  pull_request:
    paths:
      - "apps/editor/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "biome.json"
      - "tsconfig.base.json"
      - ".github/workflows/editor.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The engine and TeX Live tree, rebuilt only when the script that pins them changes.
      - uses: actions/cache@v4
        with:
          path: |
            apps/editor/.engine
            !apps/editor/.engine/downloads
          key: engine-${{ hashFiles('apps/editor/scripts/fetch-engine.ts') }}
      - run: pnpm --filter @resume-tools/editor fetch-engine
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
