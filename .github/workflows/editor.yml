name: editor

on:
  push:
    branches: [main]
    paths:
      - "apps/editor/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "biome.json"
      - "tsconfig.base.json"
      - ".github/workflows/editor.yml"
  pull_request:
    paths:
      - "apps/editor/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "biome.json"
      - "tsconfig.base.json"
      - ".github/workflows/editor.yml"

permissions:
  contents: read

# A newer push to a pull request cancels the older run; every push to main gets its own group, so
# each merge keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The job takes about two minutes. A compile that never ends cannot be stopped from inside
    # the test run, since the engine's call is synchronous, so the job's limit is what stops it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The version of opentype.js installed, which reads the fonts' tables into the manifest.
      - id: fontreader
        run: echo "opentype=$(node -p "require('./apps/editor/node_modules/opentype.js/package.json').version")" >> "$GITHUB_OUTPUT"
      # The engine and TeX Live tree, rebuilt only when what builds them changes: the script that
      # pins them, the modules that unpack the archive's packages and read their entries, the one
      # that writes fontconfig's configuration, the modules it merges the font maps with, which write
      # the tree's pdftex.map, and the one that reads the fonts' tables into the manifest, with the
      # version of opentype.js it reads them with.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/editor/.engine
            !apps/editor/.engine/downloads
          key: engine-${{ hashFiles('apps/editor/scripts/fetch-engine.ts', 'apps/editor/scripts/containers.ts', 'apps/editor/scripts/fontconfig.ts', 'apps/editor/scripts/tlpdb.ts', 'apps/editor/scripts/fontmaps.ts', 'apps/editor/src/page/fontmap.ts', 'apps/editor/scripts/fonttable.ts') }}-opentype-${{ steps.fontreader.outputs.opentype }}
      - run: pnpm --filter @resume-tools/editor fetch-engine
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      # Built with no VITE_ variables set, so it is for inspection, not for deploying: nothing is
      # deployed until the engine and TeX Live are on R2 (decision 0029).
      - run: pnpm build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editor-dist
          path: apps/editor/dist
          if-no-files-found: error
          retention-days: 14
          # A re-run of the job uploads again under the same name.
          overwrite: true
