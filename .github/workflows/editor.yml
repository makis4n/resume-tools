name: editor

on:
  push:
    branches: [main]
    paths:
      - "apps/editor/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "biome.json"
      - "tsconfig.base.json"
      - ".github/workflows/editor.yml"
  pull_request:
    paths:
      - "apps/editor/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "biome.json"
      - "tsconfig.base.json"
      - ".github/workflows/editor.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    # The job takes about two minutes. A compile that never ends cannot be stopped from inside
    # the test run, since the engine's call is synchronous, so the job's limit is what stops it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The engine and TeX Live tree, rebuilt only when what builds them changes: the script that
      # pins them, the modules that unpack the archive's packages and read their entries, and the
      # modules it merges the font maps with, which write the tree's pdftex.map.
      - uses: actions/cache@v4
        with:
          path: |
            apps/editor/.engine
            !apps/editor/.engine/downloads
          key: engine-${{ hashFiles('apps/editor/scripts/fetch-engine.ts', 'apps/editor/scripts/containers.ts', 'apps/editor/scripts/tlpdb.ts', 'apps/editor/scripts/fontmaps.ts', 'apps/editor/src/page/fontmap.ts') }}
      - run: pnpm --filter @resume-tools/editor fetch-engine
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
