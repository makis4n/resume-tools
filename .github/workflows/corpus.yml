name: corpus

# The corpus of public resumes, fetched from the sources its manifest names, surveyed (decisions
# 0017 and 0018), and every document put through the import a browser runs, which sends nothing,
# held to the baseline (decisions 0043 and 0055). The naming request's leak check went with the
# naming step (decision 00XX). It runs only when a person starts it, from the Actions tab or with
# `gh workflow run corpus.yml --ref <branch>`, never on a schedule, a push or a pull request
# (decision 0035): every input is pinned, so a run finds something only after a change, and no pull
# request downloads real resumes. It holds no model key, ever: the run asks no model.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    # The import run's time on the free runner is not yet measured: about an hour was the estimate
    # with four children, and a private repository's runner has two cores, so two children run.
    # The step is given three hours, and a run stopped short still leaves what it did (decision
    # 0043).
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The version of opentype.js installed, which reads the fonts' tables into the manifest.
      - id: fontreader
        run: echo "opentype=$(node -p "require('./apps/editor/node_modules/opentype.js/package.json').version")" >> "$GITHUB_OUTPUT"
      # The engine and TeX Live tree under editor.yml's key, so that either workflow's build serves
      # the other: the survey checks every document against the tree's file list.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/editor/.engine
            !apps/editor/.engine/downloads
          key: engine-${{ hashFiles('apps/editor/scripts/fetch-engine.ts', 'apps/editor/scripts/containers.ts', 'apps/editor/scripts/fontconfig.ts', 'apps/editor/scripts/tlpdb.ts', 'apps/editor/scripts/fontmaps.ts', 'apps/editor/src/page/fontmap.ts', 'apps/editor/scripts/fonttable.ts') }}-opentype-${{ steps.fontreader.outputs.opentype }}
      - run: pnpm --filter @resume-tools/editor fetch-engine
      # GitHub allows 60 requests an hour without a token, and the fetch asks once per document.
      - run: pnpm --filter @resume-tools/editor corpus fetch
        env:
          GH_TOKEN: ${{ github.token }}
      # The table names classes, packages, fonts and counts, and survey.json each document's row by
      # its id: never a document's text.
      - run: pnpm --filter @resume-tools/editor corpus survey --json survey.json > survey.md
      - run: |
          {
            echo "## What the corpus needs"
            echo
            cat survey.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: survey
          path: survey.json
      # Every document through the import a browser runs, in its one mode, which reads no answer and
      # asks no model (decision 0055): the table and its headline name outcomes, reasons, steps and
      # counts, and run.json each document's row by its id, never a document's text. The run takes
      # as many children as the runner has cores, writes run.json after each document, and on the
      # signal a step's time running out sends, stops, prints its table and writes run.json for
      # what it did. The step fails when the success rate, a document that timed out counting in
      # none, falls more than a point under corpus/baseline.json, which a pull request raises by
      # hand, or adopts from this run's run.json with `corpus run --write-baseline --from run.json`
      # (decision 0043).
      - id: run
        timeout-minutes: 180
        run: pnpm --filter @resume-tools/editor corpus run --json run.json > run.md
      - if: always() && steps.run.outcome != 'skipped'
        run: |
          {
            echo "## The import over the corpus"
            echo
            cat run.md
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always() && steps.run.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: run
          path: run.json
