name: ats-image

# The ATS service's container image (decision 0020): tested, built and smoke-tested on every pull
# request that changes what goes into it, and that same image published to GitHub's container
# registry from main. Nothing deploys it yet.
on:
  push:
    branches: [main]
    paths:
      - "apps/ats/Dockerfile"
      - "apps/ats/.dockerignore"
      - "apps/ats/pyproject.toml"
      - "apps/ats/uv.lock"
      - "apps/ats/src/**"
      - "packages/contracts/**"
      - ".github/scripts/smoke-ats-image.sh"
      - ".github/workflows/ats-image.yml"
  pull_request:
    paths:
      - "apps/ats/Dockerfile"
      - "apps/ats/.dockerignore"
      - "apps/ats/pyproject.toml"
      - "apps/ats/uv.lock"
      - "apps/ats/src/**"
      - "packages/contracts/**"
      - ".github/scripts/smoke-ats-image.sh"
      - ".github/workflows/ats-image.yml"

permissions:
  contents: read

# A newer push to a pull request cancels the older run. Runs on main queue one at a time, so an
# older image can never overwrite `main` after a newer one; a run still waiting when another is
# queued is dropped, which only skips an image that was about to be superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/makis4n/resume-tools-ats

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      # The ats workflow runs these too, but separately; here they gate what gets published.
      - run: uv sync --frozen && uv run pytest
        working-directory: apps/ats
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # `sha-<commit>` names one build; `main` moves to the newest.
          tags: |
            type=sha,format=long
            type=raw,value=main,enable={{is_default_branch}}
      # No provenance or SBOM attestations, so the image is one manifest and pruning old versions
      # cannot delete part of an image that is still tagged.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/ats
          load: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ats-image
          cache-to: type=gha,scope=ats-image,mode=max
      - env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: bash .github/scripts/smoke-ats-image.sh "$(head -n 1 <<<"$TAGS")"
      # Handed to the publish job as is, so what is published is exactly what was tested.
      - if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          mapfile -t tags <<<"$TAGS"
          docker save "${tags[@]}" | gzip >ats-image.tar.gz
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ats-image
          path: ats-image.tar.gz
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # The only job that can write packages, and it runs only on main.
  publish:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ats-image
      - run: gunzip -c ats-image.tar.gz | docker load
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker image ls "$IMAGE" --format '{{.Repository}}:{{.Tag}}' | while read -r tag; do
            docker push "$tag"
          done
      # The free plan stores 500 MB of private packages and an image is about 50 MB compressed,
      # so only the newest five builds are kept; older `sha-` tags stop resolving.
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: resume-tools-ats
          package-type: container
          min-versions-to-keep: 5
