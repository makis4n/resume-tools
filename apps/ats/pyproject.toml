[project]
name = "ats"
version = "0.1.0"
description = "ATS simulator and resume optimiser"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pypdfium2>=5.13.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
ats-serve = "ats.service:main"

[dependency-groups]
dev = [
  "httpx2>=2.13.1",
  "jsonschema>=4.26.0",
  "pytest>=8",
  "ruff>=0.12",
]

[build-system]
# Pinned, since it builds the wheel the image installs and uv.lock does not cover it.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ats"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
